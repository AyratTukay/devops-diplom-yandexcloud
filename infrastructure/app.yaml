apiVersion: v1
kind: Namespace
metadata:
  name: test-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-nginx-app
  namespace: test-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-nginx-app
  template:
    metadata:
      labels:
        app: test-nginx-app
    spec:
      imagePullSecrets:
        - name: ycr-secret
      containers:
        - name: nginx
          image: cr.yandex/crpdtjg2rugtfvocd2ft/test-app:v1.0.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: test-nginx-service
  namespace: test-app
spec:
  type: NodePort
  selector:
    app: test-nginx-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080